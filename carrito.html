<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi carrito - PoliMarket</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js" defer></script>
  <script src="carrito.js" defer></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; }
    .fila-carrito {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
    }
    .fila-carrito img { width: 60px; height: 60px; object-fit: cover; }
    .fila-carrito input { width: 50px; }
    #totalCarrito { font-size: 20px; font-weight: bold; margin-top: 16px; }
    #btnFinalizar { margin-top: 12px; padding: 10px 16px; cursor: pointer; }
    nav a { margin-right: 16px; }
    @media (max-width: 640px) {
      .fila-carrito { flex-wrap: wrap; }
      .fila-carrito span { flex: 1 1 auto; }
      nav a { display: inline-block; margin-bottom: 6px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="catalogo.html">Catálogo</a>
    <a href="carrito.html">Mi carrito</a>
    <a href="favoritos.html">Mis favoritos</a>
    <a href="mis-pedidos.html">Mis pedidos</a>
  </nav>

  <h2>Mi carrito</h2>

  <div id="contenedorCarrito">
    <!-- Aquí se pinta la lista del carrito automáticamente -->
  </div>

  <p id="totalCarrito"></p>

  <button id="btnFinalizar" onclick="irAPagar()" style="display:none;">
    Finalizar compra
  </button>
</body>
</html>
